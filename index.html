<!DOCTYPE html>
<html lang="fr" data-r09-state="booting">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="r09-version" content="0.1.0-github-demo">
  <title>R09 — Souveraineté Locale, Puissance Mutualisée</title>

  <!--
    ==========================================================================
    R09.OS v0.1 — ARCHITECTURE MONOLITHIQUE AUTARCIQUE (1 FILE = 1 TRUTH)
    - Zéro dépendance externe côté noyau, zéro serveur backend.
    - Loi du Quantum : chaque module <template data-type="logic"> < 1024 car.
    - Système 1 (FractalNode + Primitives Jev) en local sur tous terminaux.
    - Système 2 (WebGPU LLM + WebRTC P2P) mutualisé entre pairs.
    ==========================================================================
  -->

  <style data-r09-base="true">
    :root {
      --r09-bg: #070a12;
      --r09-fg: #f1f5f9;
      --r09-muted: #94a3b8;
      --r09-win-bg: rgba(15, 23, 42, 0.72);
      --r09-win-border: rgba(255, 255, 255, 0.14);
      --r09-blur: 16px;
      --r09-accent: #6366f1;
      --r09-accent2: #38bdf8;
      --r09-radius: 18px;
      --r09-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      height: 100dvh;
      overflow: hidden;
      background: var(--r09-bg);
      color: var(--r09-fg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      transition: background 0.45s ease, color 0.35s ease;
      user-select: none;
    }

    /* Halos ambiants révélant instantanément le glassmorphisme et les dégradés */
    body::before, body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      filter: blur(85px);
      opacity: 0.58;
      transition: background 0.6s ease, transform 0.6s ease;
    }
    body::before {
      width: 46vmax; height: 46vmax;
      top: -12vmax; left: -10vmax;
      background: var(--r09-accent);
    }
    body::after {
      width: 44vmax; height: 44vmax;
      bottom: -14vmax; right: -8vmax;
      background: var(--r09-accent2);
    }

    #blueprint-database { display: none; }

    /* Fenêtres flottantes R09 */
    .r09-window {
      position: absolute;
      width: min(540px, 92vw);
      max-height: 68dvh;
      left: calc(50vw - min(270px, 46vw));
      top: 9dvh;
      background: var(--r09-win-bg);
      backdrop-filter: blur(var(--r09-blur));
      -webkit-backdrop-filter: blur(var(--r09-blur));
      border: 1px solid var(--r09-win-border);
      border-radius: var(--r09-radius);
      box-shadow: var(--r09-shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background 0.4s ease, border-color 0.3s ease, box-shadow 0.4s ease, border-radius 0.3s ease;
    }

    .w-head {
      height: 38px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--r09-win-border);
      background: rgba(255, 255, 255, 0.04);
      cursor: grab;
      touch-action: none;
      flex-shrink: 0;
    }
    .w-close {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #f43f5e;
      cursor: pointer;
      flex-shrink: 0;
    }
    .w-title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.3px;
      opacity: 0.9;
    }
    .w-body {
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 13px;
      line-height: 1.5;
      user-select: text;
    }

    /* Bureau, barre de télémétrie et Dock */
    .r09-desktop {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9000;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 12px 10px 16px;
    }

    .top-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      max-width: 96vw;
    }

    .pill-bar {
      pointer-events: auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      align-items: center;
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 600;
      background: var(--r09-win-bg);
      border: 1px solid var(--r09-win-border);
      backdrop-filter: blur(var(--r09-blur));
      -webkit-backdrop-filter: blur(var(--r09-blur));
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #64748b;
      display: inline-block;
      margin-right: 4px;
    }
    .dot.ok { background: #10b981; box-shadow: 0 0 8px #10b981; }
    .dot.busy { background: #f59e0b; box-shadow: 0 0 8px #f59e0b; }
    .dot.err { background: #f43f5e; box-shadow: 0 0 8px #f43f5e; }

    .bottom-stack {
      pointer-events: auto;
      width: min(560px, 94vw);
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }

    .prompt-box {
      width: 100%;
      display: flex;
      gap: 8px;
      padding: 6px 8px 6px 14px;
      background: var(--r09-win-bg);
      border: 1px solid var(--r09-win-border);
      border-radius: 99px;
      box-shadow: var(--r09-shadow);
      backdrop-filter: blur(var(--r09-blur));
      -webkit-backdrop-filter: blur(var(--r09-blur));
    }
    .prompt-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--r09-fg);
      font-size: 16px; /* >= 16px évite le zoom automatique Safari iOS */
      min-width: 0;
    }
    .prompt-box input::placeholder { color: var(--r09-muted); font-size: 13px; }

    .dock {
      display: flex;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 20px;
      background: var(--r09-win-bg);
      border: 1px solid var(--r09-win-border);
      backdrop-filter: blur(var(--r09-blur));
      -webkit-backdrop-filter: blur(var(--r09-blur));
    }

    .c-btn {
      background: var(--r09-accent);
      color: #ffffff;
      border: none;
      border-radius: 99px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.12s ease, opacity 0.2s ease;
    }
    .c-btn:active { transform: scale(0.96); }
    .c-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .c-btn.sec {
      background: rgba(255, 255, 255, 0.1);
      color: var(--r09-fg);
      border: 1px solid var(--r09-win-border);
    }

    .c-inp, .c-txt, .c-sel {
      width: 100%;
      background: rgba(0, 0, 0, 0.22);
      color: var(--r09-fg);
      border: 1px solid var(--r09-win-border);
      border-radius: 10px;
      padding: 8px 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      outline: none;
    }
    .c-txt { height: 64px; resize: none; }

    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .card {
      padding: 11px 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--r09-win-border);
    }

    .prog-bg {
      width: 100%; height: 6px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 99px;
      overflow: hidden;
      margin-top: 8px;
    }
    .prog-fill {
      height: 100%; width: 0%;
      background: var(--r09-accent);
      transition: width 0.2s ease;
    }

    .chat-box {
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 8px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--r09-win-border);
    }
    .msg { padding: 8px 10px; border-radius: 10px; font-size: 12.5px; word-break: break-word; }
    .msg.u { background: rgba(99, 102, 241, 0.25); align-self: flex-end; max-width: 88%; }
    .msg.ai { background: rgba(255, 255, 255, 0.07); align-self: flex-start; max-width: 94%; }
    .diag-log {
      font-family: ui-monospace, monospace;
      font-size: 11px;
      max-height: 95px;
      overflow-y: auto;
      color: var(--r09-muted);
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="blueprint-database">

    <!-- 1. BUS D'ÉVÉNEMENTS O(1) (< 350 car.) -->
    <template id="core_ether" data-type="logic">
      <script>
        window.R09_Core = {
          Ether: (() => {
            const t = new Map();
            return {
              on: (e, cb) => { if (!t.has(e)) t.set(e, new Set()); t.get(e).add(cb); },
              off: (e, cb) => t.get(e)?.delete(cb),
              emit: (e, d) => t.get(e)?.forEach(cb => { try { cb(d); } catch (err) { console.error(e, err); } })
            };
          })()
        };
      </script>
    </template>

    <!-- 2. MÉMOIRE VIVE RÉACTIVE (< 300 car.) -->
    <template id="core_ram" data-type="logic">
      <script>
        window.R09_Core.createRAM = (ether) => {
          const m = new Map();
          return {
            read: id => m.get(id),
            write: (id, d) => { m.set(id, d); ether.emit('ram›write', { id }); },
            list: () => Array.from(m.keys())
          };
        };
      </script>
    </template>

    <!-- 3. ÉTAT COURANT DES VARIABLES CSS (DATA) -->
    <template id="sys_theme_dict" data-type="data">{
  "--r09-bg": "#070a12",
  "--r09-fg": "#f1f5f9",
  "--r09-muted": "#94a3b8",
  "--r09-win-bg": "rgba(15, 23, 42, 0.72)",
  "--r09-win-border": "rgba(255, 255, 255, 0.14)",
  "--r09-blur": "16px",
  "--r09-accent": "#6366f1",
  "--r09-accent2": "#38bdf8",
  "--r09-radius": "18px",
  "--r09-shadow": "0 24px 60px rgba(0, 0, 0, 0.55)"
}</template>

    <!-- 4. MOTEUR DE THÈME & PILE UNDO O(1) (< 650 car.) -->
    <template id="logic_theme" data-type="logic">
      <script>
        (() => {
          const hist = [], r = document.documentElement.style;
          const getCur = () => JSON.parse(ram.read('sys_theme_dict').content);
          const paint = obj => {
            for (const [k, v] of Object.entries(obj)) r.setProperty(k, v);
            ram.write('sys_theme_dict', { id: 'sys_theme_dict', type: 'data', content: JSON.stringify(obj, null, 2) });
          };
          ether.on('theme›patch', ({ patch, save = true }) => {
            const cur = getCur();
            if (save) hist.push({ ...cur });
            paint({ ...cur, ...patch });
          });
          ether.on('theme›undo', () => {
            if (hist.length) paint(hist.pop());
            ether.emit('ui›toast', '↩ Thème précédent restauré (0 ms)');
          });
          paint(getCur());
        })();
      </script>
    </template>

    <!-- 5. GESTIONNAIRE DE FENÊTRES FLOTTANTES (< 850 car.) -->
    <template id="core_window" data-type="logic">
      <script>
        (() => {
          let z = 100, d = null, ox = 0, oy = 0;
          window.addEventListener('pointermove', e => {
            if (!d) return;
            d.style.left = (e.clientX - ox) + 'px';
            d.style.top = (e.clientY - oy) + 'px';
          });
          window.addEventListener('pointerup', () => { d = null; });
          ether.on('win›close', id => document.getElementById('w-' + id)?.remove());
          ether.on('win›open', id => {
            const ex = document.getElementById('w-' + id);
            if (ex) { ex.style.zIndex = ++z; return; }
            const mod = ram.read(id); if (!mod) return;
            const w = document.createElement('div');
            w.id = 'w-' + id; w.className = 'r09-window'; w.style.zIndex = ++z;
            w.innerHTML = `<div class="w-head"><div class="w-close"></div><div class="w-title">${mod.name || id}</div></div><div class="w-body">${mod.content}</div>`;
            w.querySelector('.w-close').onclick = () => ether.emit('win›close', id);
            w.querySelector('.w-head').onpointerdown = e => {
              if (e.target.classList.contains('w-close')) return;
              d = w; ox = e.clientX - w.offsetLeft; oy = e.clientY - w.offsetTop; w.style.zIndex = ++z;
            };
            document.body.appendChild(w);
            ether.emit('app›mount›' + id, w);
          });
        })();
      </script>
    </template>

    <!-- 6. GABARIT DU BUREAU & BARRE DE TÉLÉMÉTRIE -->
    <template id="sys_desktop" data-type="layout">
      <div class="r09-desktop">
        <div class="top-stack">
          <div class="pill-bar">
            <span>R09.OS v0.1</span>
            <span>•</span>
            <span><i id="dot-p2p" class="dot"></i><span id="lbl-p2p">P2P Hors-ligne</span></span>
            <span>•</span>
            <span><i id="dot-ai" class="dot"></i><span id="lbl-ai">GPU Inactif</span></span>
          </div>
          <div id="r09-trace" class="pill-bar" style="font-weight:400;opacity:0.85;">FractalNode + JEV : En attente</div>
          <div id="r09-toast" class="pill-bar" style="opacity:0;transition:opacity .25s;">Prêt</div>
        </div>
        <div class="bottom-stack">
          <div class="prompt-box">
            <input id="r09-prompt" type="text" placeholder="Ex: Thème bleu clair aquarelle, ou pose ta question..." autocomplete="off">
            <button id="r09-send" class="c-btn">Envoyer</button>
          </div>
          <div class="dock" id="sys-dock"></div>
        </div>
      </div>
    </template>

    <!-- 7. CONTRÔLEUR DU BUREAU & DOCK (< 850 car.) -->
    <template id="logic_desktop" data-type="logic">
      <script>
        (() => {
          const m = document.createElement('div');
          m.innerHTML = ram.read('sys_desktop').content;
          document.body.appendChild(m.firstElementChild);
          const dock = document.getElementById('sys-dock');
          ram.list().filter(id => ram.read(id).type === 'app').forEach(id => {
            const b = document.createElement('button');
            b.className = 'c-btn sec'; b.textContent = ram.read(id).name;
            b.onclick = () => ether.emit('win›open', id);
            dock.appendChild(b);
          });
          const inp = document.getElementById('r09-prompt');
          const go = () => { if (inp.value.trim()) { ether.emit('cmd›exec', inp.value.trim()); inp.value = ''; } };
          document.getElementById('r09-send').onclick = go;
          inp.onkeydown = e => { if (e.key === 'Enter') go(); };
          let tm;
          ether.on('ui›toast', msg => {
            const t = document.getElementById('r09-toast');
            t.textContent = msg; t.style.opacity = '1';
            clearTimeout(tm); tm = setTimeout(() => t.style.opacity = '0', 2800);
          });
          ether.on('ui›trace', msg => { document.getElementById('r09-trace').textContent = msg; });
        })();
      </script>
    </template>

    <!-- 8. SYSTÈME 1 : FRACTALNODE + PRIMITIVES TYPÉES JEV (< 980 car.) -->
    <template id="logic_fractal_jev" data-type="logic">
      <script>
        (() => {
          const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
          const noul = (txt, dict) => {
            const w = norm(txt).match(/[a-z0-9]{3,}/g) || [];
            let sc = 0;
            for (const [k, v] of Object.entries(dict)) if (w.some(x => x.includes(k))) sc += v;
            return Math.min(1, sc);
          };
          const choice = txt => {
            const opts = {
              UNDO: noul(txt, { revien: 0.9, preced: 0.9, annul: 0.9, undo: 0.9, retour: 0.8 }),
              COMMIT: noul(txt, { valid: 0.95, partout: 0.85, synchronis: 0.9, fix: 0.8, commit: 0.95 }),
              THEME_UI: noul(txt, { theme: 0.9, interfac: 0.8, couleur: 0.85, aquarell: 0.95, glassmorph: 0.95, flou: 0.85, fenetr: 0.75, sombr: 0.8, clair: 0.8, pastel: 0.9 })
            };
            const best = Object.entries(opts).sort((a, b) => b[1] - a[1])[0];
            return best[1] >= 0.75 ? { act: best[0], conf: best[1], undoFirst: opts.UNDO >= 0.75 } : { act: 'OPEN_CHAT', conf: 1 - best[1], undoFirst: false };
          };
          ether.on('cmd›exec', raw => {
            const t0 = performance.now(), d = choice(raw), dt = (performance.now() - t0).toFixed(2);
            ether.emit('ui›trace', `FractalNode/JEV → ${d.act} (${Math.round(d.conf * 100)}% • ${dt}ms)`);
            ether.emit('diag›log', `[JEV] "${raw}" => ${d.act} (${d.conf.toFixed(2)})`);
            if (d.act === 'COMMIT') {
              const cur = JSON.parse(ram.read('sys_theme_dict').content);
              ether.emit('p2p›send', { type: 'COMMIT', patch: cur });
              return ether.emit('ui›toast', '✓ Thème validé & synchronisé sur le réseau');
            }
            if (d.undoFirst) ether.emit('theme›undo');
            if (d.act === 'UNDO') return;
            ether.emit('ai›ask', { mode: d.act === 'THEME_UI' ? 'THEME' : 'CHAT', text: raw });
          });
        })();
      </script>
    </template>

    <!-- 9. PONT WEBRTC DATACHANNEL SANS SERVEUR (< 990 car.) -->
    <template id="logic_p2p" data-type="logic">
      <script>
        (() => {
          let pc = null, dc = null;
          const cfg = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] };
          const setSt = (cls, txt) => {
            document.getElementById('dot-p2p').className = 'dot ' + cls;
            document.getElementById('lbl-p2p').textContent = txt;
          };
          const bind = c => {
            dc = c;
            dc.onopen = () => { setSt('ok', 'P2P Connecté'); ether.emit('ui›toast', '🔗 Tunnel WebRTC ouvert'); ether.emit('diag›log', '[P2P] Canal de données actif'); };
            dc.onclose = () => { setSt('err', 'P2P Fermé'); ether.emit('diag›log', '[P2P] Canal fermé'); };
            dc.onmessage = e => ether.emit('p2p›msg', JSON.parse(e.data));
          };
          const waitIce = () => new Promise(r => {
            if (pc.iceGatheringState === 'complete') return r();
            const t = setTimeout(r, 2000);
            pc.onicegatheringstatechange = () => { if (pc.iceGatheringState === 'complete') { clearTimeout(t); r(); } };
          });
          window.R09_P2P = {
            offer: async () => { pc = new RTCPeerConnection(cfg); bind(pc.createDataChannel('r09')); await pc.setLocalDescription(await pc.createOffer()); await waitIce(); return JSON.stringify(pc.localDescription); },
            answer: async s => { pc = new RTCPeerConnection(cfg); pc.ondatachannel = e => bind(e.channel); await pc.setRemoteDescription(JSON.parse(s)); await pc.setLocalDescription(await pc.createAnswer()); await waitIce(); return JSON.stringify(pc.localDescription); },
            accept: async s => { await pc.setRemoteDescription(JSON.parse(s)); },
            isOpen: () => dc?.readyState === 'open'
          };
          ether.on('p2p›send', o => { if (dc?.readyState === 'open') dc.send(JSON.stringify(o)); });
        })();
      </script>
    </template>

    <!-- 10. ROUTAGE DES PAQUETS P2P ENTRANTS (< 680 car.) -->
    <template id="logic_p2p_bus" data-type="logic">
      <script>
        ether.on('p2p›msg', m => {
          if (m.type === 'ASK') ether.emit('worker›run', { mode: m.mode, text: m.text, remote: true });
          if (m.type === 'PATCH') {
            ether.emit('theme›patch', { patch: m.patch });
            ether.emit('ui›toast', '✨ Thème reçu depuis le nœud GPU distant');
          }
          if (m.type === 'COMMIT') {
            ether.emit('theme›patch', { patch: m.patch, save: false });
            ether.emit('ui›toast', '✓ Thème validé depuis le terminal distant');
          }
          if (m.type === 'STREAM') ether.emit('chat›stream', m);
        });
      </script>
    </template>

    <!-- 11. DÉMON WEBGPU SUR MAC MINI M2 (< 960 car.) -->
    <template id="logic_gpu" data-type="logic">
      <script>
        window.R09_GPU = {
          eng: null, ready: false,
          boot: async (modId) => {
            if (!navigator.gpu) throw new Error('WebGPU non supporté sur ce navigateur (utilise Chrome sur Mac)');
            ether.emit('gpu›prog', { pct: 5, txt: 'Importation du moteur MLC WebGPU...' });
            const webllm = await import('https://esm.run/@mlc-ai/web-llm');
            window.R09_GPU.eng = await webllm.CreateMLCEngine(modId, {
              initProgressCallback: r => ether.emit('gpu›prog', { pct: Math.round(r.progress * 100), txt: r.text })
            });
            window.R09_GPU.ready = true;
            document.getElementById('dot-ai').className = 'dot ok';
            document.getElementById('lbl-ai').textContent = 'GPU M2 Actif';
            ether.emit('diag›log', '[GPU] Modèle chargé en VRAM : ' + modId);
          }
        };
      </script>
    </template>

    <!-- 12. EXÉCUTION IA DISTRIBUÉE (SYSTÈME 2 : THÈME JSON & STREAMING LIBRE) (< 995 car.) -->
    <template id="logic_worker" data-type="logic">
      <script>
        (() => {
          const ask = async ({ mode, text, remote = false }) => {
            if (!window.R09_GPU?.ready) {
              const err = '⚠ Aucun nœud GPU actif (charge le modèle sur le Mac Mini M2)';
              return remote ? ether.emit('p2p›send', { type: 'STREAM', delta: err, done: true }) : ether.emit('ui›toast', err);
            }
            document.getElementById('dot-ai').className = 'dot busy';
            const cur = ram.read('sys_theme_dict').content;
            const sys = mode === 'THEME'
              ? `Tu es le moteur CSS de R09.OS. État actuel: ${cur}. Réponds UNIQUEMENT par un JSON valide (zéro texte) modifiant les clés pertinentes parmi "--r09-bg","--r09-fg","--r09-muted","--r09-win-bg","--r09-win-border","--r09-blur","--r09-accent","--r09-accent2","--r09-radius". Aquarelle bleu clair: fond pastel #e0f2fe, texte #0f172a, fenêtres rgba(255,255,255,0.68), accent #0284c7. Glassmorphisme: --r09-win-bg rgba(255,255,255,0.14), --r09-blur 28px, --r09-win-border rgba(255,255,255,0.35).`
              : `Tu es l'IA souveraine de R09.OS exécutée localement sur GPU. Réponds de façon claire, précise et structurée en français.`;
            try {
              const t0 = performance.now(); let out = '', tok = 0;
              const st = await window.R09_GPU.eng.chat.completions.create({
                messages: [{ role: 'system', content: sys }, { role: 'user', content: text }],
                temperature: mode === 'THEME' ? 0.15 : 0.6, stream: true
              });
              for await (const c of st) {
                const d = c.choices?.[0]?.delta?.content || '';
                if (!d) continue;
                out += d; tok++;
                if (mode === 'CHAT') {
                  const msg = { type: 'STREAM', ask: tok === 1 ? text : '', delta: d, done: false };
                  remote ? ether.emit('p2p›send', msg) : ether.emit('chat›stream', msg);
                }
              }
              const tps = (tok / ((performance.now() - t0) / 1000)).toFixed(1);
              if (mode === 'THEME') {
                const patch = JSON.parse(out.match(/\{[\s\S]*\}/)[0]);
                remote ? ether.emit('p2p›send', { type: 'PATCH', patch }) : ether.emit('theme›patch', { patch });
                ether.emit('diag›log', `[GPU] Patch CSS généré à ${tps} tok/s`);
              } else {
                const end = { type: 'STREAM', delta: '', done: true, meta: `${tok} tokens • ${tps} tok/s (GPU M2)` };
                remote ? ether.emit('p2p›send', end) : ether.emit('chat›stream', end);
              }
            } catch (e) { ether.emit('diag›log', '[GPU ERR] ' + e.message); }
            document.getElementById('dot-ai').className = 'dot ok';
          };
          ether.on('worker›run', ask);
          ether.on('ai›ask', p => {
            if (p.mode === 'CHAT') ether.emit('chat›open', p.text);
            if (window.R09_P2P?.isOpen() && !window.R09_GPU?.ready) ether.emit('p2p›send', { type: 'ASK', mode: p.mode, text: p.text });
            else ask(p);
          });
        })();
      </script>
    </template>

    <!-- 13. PERSISTANCE QUINE ("1 FILE = 1 TRUTH") (< 650 car.) -->
    <template id="core_quine" data-type="logic">
      <script>
        ether.on('sys›export', () => {
          const doc = document.documentElement.cloneNode(true);
          doc.querySelectorAll('.r09-window, .r09-desktop').forEach(n => n.remove());
          const db = doc.querySelector('#blueprint-database');
          db.innerHTML = '';
          ram.list().forEach(id => {
            const m = ram.read(id), t = document.createElement('template');
            t.id = m.id; t.dataset.type = m.type; if (m.name) t.dataset.name = m.name;
            t.innerHTML = m.content; db.appendChild(t);
          });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(new Blob(['<!DOCTYPE html>\n' + doc.outerHTML], { type: 'text/html' }));
          a.download = 'R09.OS_v0.1_validated.html'; a.click();
          ether.emit('ui›toast', '💾 OS autonome exporté (1 File = 1 Truth)');
        });
      </script>
    </template>

    <!-- 14. APPLICATION : IA & APERÇU VISUEL -->
    <template id="app_chat" data-type="app" data-name="IA & Aperçu">
      <div class="card">
        <strong>R09 — Souveraineté Locale, Puissance Mutualisée</strong><br>
        <span style="color:var(--r09-muted);font-size:12px;">WebOS Vanilla & IA souveraine • Système 1 (JEV) + Système 2 (WebGPU P2P)</span>
      </div>
      <div id="chat-stream-box" class="chat-box">
        <div class="msg ai">En attente d'instruction. Essaie un changement de thème ou pose une question complexe au nœud GPU distant.</div>
      </div>
      <div class="row">
        <button class="c-btn" onclick="window.AtomAPI.emit('sys›export')">💾 Exporter mon OS (Quine)</button>
        <button class="c-btn sec" onclick="window.AtomAPI.emit('theme›undo')">↩ Undo Thème</button>
      </div>
    </template>

    <!-- 15. CONTRÔLEUR STREAMING DU CHAT (< 760 car.) -->
    <template id="logic_chat_ui" data-type="logic">
      <script>
        (() => {
          let curAi = null;
          const add = (cls, txt) => {
            const box = document.getElementById('chat-stream-box'); if (!box) return null;
            const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = txt;
            box.appendChild(d); box.scrollTop = box.scrollHeight; return d;
          };
          ether.on('chat›open', q => {
            ether.emit('win›open', 'app_chat');
            setTimeout(() => { add('u', q); curAi = add('ai', '⏳ Réflexion sur le nœud GPU...'); }, 30);
          });
          ether.on('chat›stream', m => {
            if (!document.getElementById('w-app_chat')) ether.emit('win›open', 'app_chat');
            setTimeout(() => {
              if (m.ask && !curAi) add('u', m.ask);
              if (!curAi) curAi = add('ai', '');
              if (curAi.textContent.startsWith('⏳')) curAi.textContent = '';
              curAi.textContent += m.delta || '';
              if (m.done) {
                if (m.meta) curAi.textContent += `\n\n⚡ [${m.meta}]`;
                curAi = null;
              }
              const box = document.getElementById('chat-stream-box');
              if (box) box.scrollTop = box.scrollHeight;
            }, 20);
          });
        })();
      </script>
    </template>

    <!-- 16. APPLICATION : RÉSEAU P2P & MOTEUR WEBGPU -->
    <template id="app_p2p" data-type="app" data-name="Réseau P2P & GPU">
      <div class="card">
        <strong>1. Cerveau Neuronal WebGPU (à activer sur le Mac Mini M2)</strong>
        <div class="row" style="margin-top:8px;">
          <select id="gpu-model-sel" class="c-sel" style="flex:2;">
            <option value="Llama-3.2-3B-Instruct-q4f16_1-MLC">Llama-3.2-3B-Instruct (Recommandé M2 • ~1.8 Go)</option>
            <option value="Llama-3.2-1B-Instruct-q4f16_1-MLC">Llama-3.2-1B-Instruct (Ultra-rapide • ~850 Mo)</option>
          </select>
          <button id="btn-boot-gpu" class="c-btn" style="flex:1;">Charger GPU</button>
        </div>
        <div class="prog-bg"><div id="gpu-bar" class="prog-fill"></div></div>
        <div id="gpu-txt" style="font-size:11px;color:var(--r09-muted);margin-top:4px;">En attente d'activation (inutile sur iPhone)</div>
      </div>

      <div class="card">
        <strong>2. Appairage WebRTC Direct (Mac ↔ iPhone sans serveur)</strong>
        <textarea id="p2p-sdp" class="c-txt" style="margin-top:8px;" placeholder="Colle ici le jeton WebRTC échangé entre ton Mac et ton iPhone..."></textarea>
        <div class="row" style="margin-top:8px;">
          <button id="p2p-offer" class="c-btn">1. Créer Offre (Mac)</button>
          <button id="p2p-ans" class="c-btn sec">2. Répondre (iPhone)</button>
          <button id="p2p-acc" class="c-btn sec">3. Valider Réponse (Mac)</button>
        </div>
      </div>

      <div class="card">
        <strong>3. Journal de Diagnostic Temps Réel</strong>
        <div id="r09-diag" class="diag-log" style="margin-top:6px;">[BOOT] Noyau R09.OS prêt.</div>
      </div>
    </template>

    <!-- 17. CONTRÔLEUR UI DU RÉSEAU P2P & DIAGNOSTIC (< 950 car.) -->
    <template id="logic_p2p_ui" data-type="logic">
      <script>
        (() => {
          const logs = ['[BOOT] Noyau R09.OS initialisé (Loi Quantum OK)'];
          ether.on('diag›log', l => {
            logs.push(l); if (logs.length > 30) logs.shift();
            const el = document.getElementById('r09-diag');
            if (el) { el.textContent = logs.join('\n'); el.scrollTop = el.scrollHeight; }
          });
          ether.on('gpu›prog', ({ pct, txt }) => {
            const b = document.getElementById('gpu-bar'), t = document.getElementById('gpu-txt');
            if (b) b.style.width = pct + '%';
            if (t) t.textContent = `${pct}% — ${txt}`;
          });
          ether.on('app›mount›app_p2p', w => {
            const sdp = w.querySelector('#p2p-sdp'), bg = w.querySelector('#btn-boot-gpu');
            const d = document.getElementById('r09-diag'); if (d) d.textContent = logs.join('\n');
            if (window.R09_GPU?.ready) { bg.textContent = '🟢 GPU Actif'; bg.disabled = true; }
            bg.onclick = async () => {
              bg.disabled = true; bg.textContent = 'Chargement...';
              try { await window.R09_GPU.boot(w.querySelector('#gpu-model-sel').value); bg.textContent = '🟢 GPU Actif'; }
              catch (e) { bg.disabled = false; bg.textContent = 'Réessayer'; ether.emit('diag›log', '[ERR] ' + e.message); }
            };
            w.querySelector('#p2p-offer').onclick = async () => { sdp.value = 'Génération ICE...'; sdp.value = await window.R09_P2P.offer(); try { await navigator.clipboard.writeText(sdp.value); } catch (_) {} ether.emit('ui›toast', '📋 Offre prête (copiée dans le presse-papiers)'); };
            w.querySelector('#p2p-ans').onclick = async () => { sdp.value = await window.R09_P2P.answer(sdp.value.trim()); try { await navigator.clipboard.writeText(sdp.value); } catch (_) {} ether.emit('ui›toast', '📋 Réponse prête (colle-la sur le Mac)'); };
            w.querySelector('#p2p-acc').onclick = async () => { await window.R09_P2P.accept(sdp.value.trim()); };
          });
        })();
      </script>
    </template>

  </div>

  <!-- BOOTLOADER SÉQUENTIEL ZÉRO-EVAL (< 750 car.) -->
  <script id="r09-bootloader">
    (() => {
      const db = document.getElementById('blueprint-database');
      const tpls = Array.from(db.querySelectorAll('template'));
      const run = code => { const s = document.createElement('script'); s.textContent = code; document.body.appendChild(s); s.remove(); };
      run(tpls.find(t => t.id === 'core_ether').content.querySelector('script').textContent);
      run(tpls.find(t => t.id === 'core_ram').content.querySelector('script').textContent);
      const ether = window.R09_Core.Ether, ram = window.R09_Core.createRAM(ether);
      window.AtomAPI = Object.freeze({ on: ether.on, off: ether.off, emit: ether.emit, read: ram.read, write: ram.write, list: ram.list });
      tpls.forEach(t => ram.write(t.id, { id: t.id, type: t.dataset.type, name: t.dataset.name, content: t.innerHTML.trim() }));
      tpls.filter(t => t.dataset.type === 'logic' && !['core_ether', 'core_ram'].includes(t.id)).forEach(t => {
        run(`((ether, ram) => {\n${t.content.querySelector('script').textContent}\n})(window.AtomAPI, window.AtomAPI);`);
      });
      document.documentElement.dataset.r09State = 'idle';
      ether.emit('win›open', 'app_chat');
      ether.emit('win›open', 'app_p2p');
    })();
  </script>
