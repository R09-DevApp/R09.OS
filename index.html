  <style data-r09-base="true">
    :root {
      --r09-bg: #080b14;
      --r09-fg: #e2e8f0;
      --r09-muted: #94a3b8;
      --r09-win-bg: rgba(17, 24, 39, 0.72);
      --r09-win-border: rgba(255, 255, 255, 0.15);
      --r09-blur: 16px;
      --r09-accent: #6366f1;
      --r09-radius: 18px;
      --r09-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; height: 100dvh; overflow: hidden;
      background: var(--r09-bg); color: var(--r09-fg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      transition: background 0.45s ease, color 0.35s ease;
      user-select: none;
    }
    body::before, body::after {
      content: ""; position: fixed; border-radius: 50%; pointer-events: none; z-index: 0;
      filter: blur(85px); opacity: 0.55; transition: all 0.6s ease;
    }
    body::before { width: 46vmax; height: 46vmax; top: -12vmax; left: -10vmax; background: var(--r09-accent); }
    body::after { width: 42vmax; height: 42vmax; bottom: -14vmax; right: -8vmax; background: color-mix(in srgb, var(--r09-accent) 60%, #38bdf8); }
    #blueprint-database { display: none; }
    .r09-window {
      position: absolute; width: min(500px, 92vw); max-height: 66dvh;
      left: calc(50vw - min(250px, 46vw)); top: 9dvh;
      background: var(--r09-win-bg);
      backdrop-filter: blur(var(--r09-blur)); -webkit-backdrop-filter: blur(var(--r09-blur));
      border: 1px solid var(--r09-win-border); border-radius: var(--r09-radius);
      box-shadow: var(--r09-shadow); display: flex; flex-direction: column;
      overflow: hidden; transition: background 0.4s ease, border-color 0.3s ease, box-shadow 0.4s ease, border-radius 0.3s ease;
    }
    .w-head {
      height: 38px; padding: 0 14px; display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid var(--r09-win-border); cursor: grab; touch-action: none;
      background: rgba(255, 255, 255, 0.04);
    }
    .w-close { width: 12px; height: 12px; border-radius: 50%; background: #f43f5e; cursor: pointer; flex-shrink: 0; }
    .w-title { font-size: 12px; font-weight: 600; letter-spacing: 0.3px; opacity: 0.9; }
    .w-body { padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; font-size: 13px; line-height: 1.45; }
    .r09-desktop {
      position: fixed; inset: 0; pointer-events: none; z-index: 9000;
      display: flex; flex-direction: column; justify-content: space-between; align-items: center;
      padding: 12px 10px 16px;
    }
    .top-bar {
      pointer-events: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center;
      padding: 6px 14px; border-radius: 99px; font-size: 11px; font-weight: 600;
      background: var(--r09-win-bg); border: 1px solid var(--r09-win-border);
      backdrop-filter: blur(var(--r09-blur)); -webkit-backdrop-filter: blur(var(--r09-blur));
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #64748b; display: inline-block; }
    .dot.ok { background: #10b981; box-shadow: 0 0 8px #10b981; }
    .dot.busy { background: #f59e0b; box-shadow: 0 0 8px #f59e0b; }
    .bottom-stack { pointer-events: auto; width: min(540px, 94vw); display: flex; flex-direction: column; gap: 8px; align-items: center; }
    .prompt-box {
      width: 100%; display: flex; gap: 8px; padding: 6px 8px 6px 14px;
      background: var(--r09-win-bg); border: 1px solid var(--r09-win-border);
      border-radius: 99px; box-shadow: var(--r09-shadow);
      backdrop-filter: blur(var(--r09-blur)); -webkit-backdrop-filter: blur(var(--r09-blur));
    }
    .prompt-box input {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--r09-fg); font-size: 16px; min-width: 0;
    }
    .prompt-box input::placeholder { color: var(--r09-muted); font-size: 13px; }
    .dock {
      display: flex; gap: 8px; padding: 7px 12px; border-radius: 20px;
      background: var(--r09-win-bg); border: 1px solid var(--r09-win-border);
      backdrop-filter: blur(var(--r09-blur)); -webkit-backdrop-filter: blur(var(--r09-blur));
    }
    .c-btn {
      background: var(--r09-accent); color: #fff; border: none; border-radius: 99px;
      padding: 8px 13px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
      transition: transform 0.12s ease, opacity 0.2s ease;
    }
    .c-btn:active { transform: scale(0.96); }
    .c-btn.sec { background: rgba(255, 255, 255, 0.1); color: var(--r09-fg); border: 1px solid var(--r09-win-border); }
    .c-inp, .c-txt {
      width: 100%; background: rgba(0, 0, 0, 0.22); color: var(--r09-fg);
      border: 1px solid var(--r09-win-border); border-radius: 10px; padding: 8px 10px;
      font-family: monospace; font-size: 12px; outline: none;
    }
    .c-txt { height: 60px; resize: none; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .card { padding: 11px; border-radius: 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--r09-win-border); }
    .muted { color: var(--r09-muted); font-size: 11px; }
  </style>
</head>

    <template id="logic_desktop" data-type="logic">
      <script>
        (()=>{const m=document.createElement('div');m.innerHTML=ram.read('sys_desktop').content;document.body.appendChild(m.firstElementChild);const dk=document.getElementById('sys-dock');ram.list().filter(i=>ram.read(i).type==='app').forEach(i=>{const b=document.createElement('button');b.className='c-btn sec';b.textContent=ram.read(i).name;b.onclick=()=>ether.emit('win›open',i);dk.appendChild(b);});const inp=document.getElementById('r09-prompt'),go=()=>{if(inp.value.trim()){ether.emit('cmd›exec',inp.value.trim());inp.value='';}};document.getElementById('r09-send').onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go();};let tm;ether.on('ui›toast',g=>{const t=document.getElementById('r09-toast');t.textContent=g;t.style.opacity='1';clearTimeout(tm);tm=setTimeout(()=>t.style.opacity='0',2600);});})();

    <template id="core_fractal" data-type="logic">
      <script>
        class FractalNode{constructor(n){this.name=n;this.children=[];this.weights=null;this.rules=[];}setAsLeaf(w){this.weights=w;return this;}addChild(n){this.children.push(n);return this;}addSynergyRule(a,c){this.rules.push({a,c});return this;}process(t){const nm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');if(this.weights){const ws=nm(t).match(/[a-z0-9]+/g)||[];let sc=0;for(const[k,v]of Object.entries(this.weights)){const nk=nm(k),i=ws.findIndex(w=>w===nk||(w.length>3&&nk.length>3&&(w.includes(nk)||nk.includes(w))));if(i>-1){const neg=ws.slice(Math.max(0,i-3),i).some(x=>['pas','non','jamais','sans'].includes(x));sc+=neg?v*.1:v;}}return{intent:this.name,confidence:sc/(sc+.4)};}const act={};let b={intent:'UNKNOWN',confidence:0};for(const c of this.children){const r=c.process(t);act[c.name]=r.confidence;if(r.confidence>b.confidence)b=r;}for(const r of this.rules){let s=0,n=0,ok=1;for(const[k,th]of Object.entries(r.c)){if((act[k]||0)<th){ok=0;break;}s+=act[k];n++;}if(ok&&s/n>b.confidence)b={intent:r.a,confidence:s/n};}return b;}}window.FractalNode=FractalNode;
      </script>
    </template>

    <template id="logic_router" data-type="logic">
      <script>
        (()=>{const cfg=JSON.parse(ram.read('sys_fractal_dict').content),br=new FractalNode('R09');for(const[k,w]of Object.entries(cfg))br.addChild(new FractalNode(k).setAsLeaf(w));br.addSynergyRule('UNDO_THEME',{UNDO:.5,THEME:.5}).addSynergyRule('DO_COMMIT',{COMMIT:.5}).addSynergyRule('DO_UNDO',{UNDO:.5});ether.on('cmd›exec',txt=>{const d=br.process(txt),isTh=(d.intent==='THEME'||d.intent==='UNDO_THEME')&&d.confidence>=.62,me=R09_NODE.id;if(d.intent==='DO_COMMIT'&&d.confidence>=.62){R09_NODE.local++;ether.emit('p2p›send',{type:'COMMIT',patch:JSON.parse(ram.read('sys_theme_dict').content),from:me});return ether.emit('ui›toast',`⚡ LOCAL [${me}]`);}if(d.intent==='DO_UNDO'&&d.confidence>=.62){R09_NODE.local++;return ether.emit('theme›undo');}if(d.intent==='UNDO_THEME'){R09_NODE.local++;ether.emit('theme›undo');}document.getElementById('lbl-fractal').textContent=`${isTh?d.intent:'CHAT'} → ${window.R09_PEER?.id||me}`;ether.emit('ai›ask',{text:txt,mode:isTh?'THEME':'CHAT'});});})();

    <template id="core_sig" data-type="logic">
      <script>
        window.R09_SIG=(room,cb)=>{const te=new TextEncoder(),td=new TextDecoder(),tp='r09/v1/'+room,el=n=>{const a=[];do{let b=n%128;n>>=7;if(n)b|=128;a.push(b);}while(n);return a;},sb=s=>{const b=te.encode(s);return[b.length>>8,b.length&255,...b];},ws=new WebSocket('wss://broker.emqx.io:8084/mqtt','mqtt');ws.binaryType='arraybuffer';ws.onopen=()=>{const c=[0,4,77,81,84,84,4,2,0,60,...sb('r09'+Math.random().toString(36).slice(2,7))],s=[0,1,...sb(tp),0];ws.send(new Uint8Array([0x10,...el(c.length),...c]));ws.send(new Uint8Array([0x82,...el(s.length),...s]));cb({sys:'ready'});};ws.onmessage=e=>{const u=new Uint8Array(e.data);if((u[0]&240)===48){let i=1;while(u[i++]&128);i+=2+((u[i]<<8)|u[i+1]);try{cb(JSON.parse(td.decode(u.subarray(i))));}catch(_){}}};return{send:o=>{if(ws.readyState===1){const p=[...sb(tp),...te.encode(JSON.stringify(o))];ws.send(new Uint8Array([0x30,...el(p.length),...p]));}},close:()=>ws.close()};};
      </script>
    </template>

    <template id="core_webrtc" data-type="logic">
      <script>
        (()=>{let pc,dc,sg;const me=R09_NODE.id,w=()=>new Promise(r=>{if(pc.iceGatheringState==='complete')return r();const t=setTimeout(r,1200);pc.onicegatheringstatechange=()=>{if(pc.iceGatheringState==='complete'){clearTimeout(t);r();}};});const init=c=>{sg?.close();pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});const b=x=>{dc=x;dc.onopen=()=>{sg?.close();ether.emit('p2p›state',1);};dc.onclose=()=>ether.emit('p2p›state',0);dc.onmessage=e=>ether.emit('p2p›msg',JSON.parse(e.data));};c?b(pc.createDataChannel('r09')):pc.ondatachannel=e=>b(e.channel);};window.R09_P2P={host:r=>{init(1);sg=R09_SIG(r,async m=>{if(m.f!==me&&m.j){await pc.setLocalDescription();await w();sg.send({s:pc.localDescription,f:me});}if(m.s?.type==='answer')await pc.setRemoteDescription(m.s);});},join:r=>{init(0);sg=R09_SIG(r,async m=>{if(m.sys)sg.send({j:1,f:me});if(m.f!==me&&m.s?.type==='offer'){await pc.setRemoteDescription(m.s);await pc.setLocalDescription();await w();sg.send({s:pc.localDescription,f:me});}});},send:o=>dc?.readyState==='open'&&dc.send(JSON.stringify(o)),isOpen:()=>dc?.readyState==='open'};})();

    <template id="logic_worker" data-type="logic">
      <script>
        (()=>{const run=async({text,mode='THEME'})=>{document.getElementById('dot-ai').className='dot busy';const t0=performance.now();try{const isT=mode==='THEME',sys=isT?ram.read('sys_ai_prompt').content+'\nActuel:'+ram.read('sys_theme_dict').content:'Tu es R09.OS, IA souveraine. Réponds clairement en français.',raw=await R09_GPU.ask([{role:'system',content:sys},{role:'user',content:text}]),sec=((performance.now()-t0)/1000).toFixed(2),tok=Math.max(1,Math.round(raw.length/4)),st=`${(tok/sec).toFixed(1)} tok/s • ${sec}s`,hw=R09_GPU.eng?'WebGPU':'API',me=R09_NODE.id;if(isT){const patch=JSON.parse(raw.match(/\{[\s\S]*\}/)[0]);R09_P2P?.isOpen()?ether.emit('p2p›send',{type:'PATCH',patch,by:me,hw,stats:st}):(ether.emit('theme›patch',{patch}),ether.emit('proof›show',`🧠 ${me} (${hw} • ${st})`));}else{const pl={type:'CHAT_RES',text:raw,by:me,hw,stats:st};R09_P2P?.isOpen()?ether.emit('p2p›send',pl):ether.emit('chat›res',pl);}}catch(e){ether.emit('ui›toast','⚠ '+e.message);}document.getElementById('dot-ai').className='dot ok';};ether.on('worker›run',run);ether.on('ai›ask',q=>R09_P2P?.isOpen()&&!window.R09_IS_WORKER?ether.emit('p2p›send',{type:'PROMPT',text:q.text,mode:q.mode}):run(q));})();

    <template id="core_quine" data-type="logic">
      <script>
        ether.on('sys›export',()=>{const d=document.documentElement.cloneNode(true);d.querySelectorAll('.r09-window,.r09-desktop').forEach(n=>n.remove());const db=d.querySelector('#blueprint-database');db.innerHTML='';ram.list().forEach(i=>{const m=ram.read(i),t=document.createElement('template');t.id=m.id;t.dataset.type=m.type;if(m.name)t.dataset.name=m.name;t.innerHTML=m.content;db.appendChild(t);});const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['<!DOCTYPE html>\n'+d.outerHTML],{type:'text/html'}));a.download='R09.OS_v0.1.html';a.click();ether.emit('ui›toast','💾 Fichier OS autonome exporté');});
      </script>
    </template>

    <template id="app_welcome" data-type="app" data-name="Aperçu OS">
      <div class="card">
        <strong>R09 — Souveraineté Locale, Puissance Mutualisée</strong><br>
        <span class="muted">WebOS Vanilla & IA souveraine • Briques &lt; 1024 car. • 1 Fichier = 1 Vérité</span>
      </div>
      <div id="exec-proof" class="card" style="display:none;border-color:var(--r09-accent);font-weight:600;"></div>
      <div>Modifie l'interface depuis ton téléphone : l'IA du Mac calcule les mutations CSS et le système synchronise les deux écrans en P2P.</div>
      <div id="ai-reply" class="card" style="display:none;user-select:text;"></div>
      <div class="row">
        <button class="c-btn" onclick="window.AtomAPI.emit('sys›export')">💾 Exporter OS (Quine)</button>
        <button class="c-btn sec" onclick="window.AtomAPI.emit('theme›undo')">↩ Undo Thème</button>
      </div>
    </template>

    <template id="app_p2p" data-type="app" data-name="Réseau P2P & IA">
      <div class="card" id="node-info"></div>
      <div class="card">
        <strong>1. Cerveau IA (sur le Mac Mini M2)</strong>
        <div class="row" style="margin-top:8px;">
          <button id="btn-gpu" class="c-btn">⚡ Démarrer WebGPU + QR Code</button>
        </div>
        <div id="gpu-log" class="muted" style="margin-top:6px;">En attente d'activation sur le Mac...</div>
      </div>
      <div class="card">
        <strong>2. Connexion P2P Instantanée (Mac ↔ iPhone)</strong>
        <div class="row" style="margin-top:8px;">
          <input id="p2p-room" class="c-inp" style="width:95px;text-align:center;font-weight:bold;font-size:15px;" placeholder="Code 4 chiffres">
          <button id="btn-host" class="c-btn sec">Afficher QR</button>
          <button id="btn-join" class="c-btn">Rejoindre</button>
        </div>
        <img id="p2p-qr" alt="QR Code P2P" style="display:none;margin-top:10px;border-radius:12px;background:#fff;padding:6px;">
      </div>
    </template>

    <template id="logic_qr" data-type="logic">
      <script>
        (()=>{window.R09_QR=(el,r)=>{const u=location.origin+location.pathname+'?r='+r;el.src='https://api.qrserver.com/v1/create-qr-code/?size=160x160&data='+encodeURIComponent(u);el.style.display='block';R09_P2P.host(r);};const q=new URLSearchParams(location.search).get('r');if(q)setTimeout(()=>{R09_P2P.join(q);ether.emit('ui›toast','🔗 Connexion auto salon #'+q);},200);})();
      </script>
    </template>

    <template id="logic_p2p_ui" data-type="logic">
      <script>
        ether.on('app›mount›app_p2p',w=>{const lg=w.querySelector('#gpu-log'),ri=w.querySelector('#p2p-room'),qr=w.querySelector('#p2p-qr'),nd=w.querySelector('#node-info'),la=document.getElementById('lbl-ai'),da=document.getElementById('dot-ai'),q=new URLSearchParams(location.search).get('r');if(q)ri.value=q;const upd=()=>{nd.innerHTML=`<strong>Moi :</strong> ${R09_NODE.id} (${R09_NODE.dev})<br><strong>Pair P2P :</strong> ${window.R09_PEER?`${R09_PEER.id} (${R09_PEER.dev})`:'En attente...'}`;};upd();ether.on('peer›upd',upd);const host=()=>{const r=ri.value.trim()||String(Math.floor(1000+Math.random()*9000));ri.value=r;R09_QR(qr,r);lg.textContent=`Salon #${r} prêt — Scanne le QR code`;};w.querySelector('#btn-gpu').onclick=async()=>{window.R09_IS_WORKER=1;da.className='dot busy';la.textContent='Chargement GPU...';try{await R09_GPU.boot(t=>lg.textContent=t);da.className='dot ok';la.textContent='WebGPU Actif';host();}catch(e){lg.textContent='Erreur: '+e.message;}};w.querySelector('#btn-host').onclick=host;w.querySelector('#btn-join').onclick=()=>{if(ri.value.trim())R09_P2P.join(ri.value.trim());};});
      </script>
    </template>

  </div>

  <script id="r09-bootloader">
    (()=>{const db=document.getElementById('blueprint-database'),tpls=[...db.querySelectorAll('template')],run=c=>{const s=document.createElement('script');s.textContent=c;document.body.appendChild(s);s.remove();};run(tpls.find(t=>t.id==='core_ether').content.querySelector('script').textContent);run(tpls.find(t=>t.id==='core_ram').content.querySelector('script').textContent);const ether=window.R09_Core.Ether,ram=window.R09_Core.createRAM(ether);window.AtomAPI=Object.freeze({on:ether.on,off:ether.off,emit:ether.emit,read:ram.read,write:ram.write,list:ram.list});tpls.forEach(t=>ram.write(t.id,{id:t.id,type:t.dataset.type,name:t.dataset.name,content:t.innerHTML.trim()}));tpls.filter(t=>t.dataset.type==='logic'&&!['core_ether','core_ram'].includes(t.id)).forEach(t=>run(`((ether,ram)=>{\n${t.content.querySelector('script').textContent}\n})(window.AtomAPI,window.AtomAPI);`));document.documentElement.dataset.r09State='idle';ether.emit('win›open','app_welcome');})();
  </script>
</body>
</html>
